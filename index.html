<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VETO — Gaming Team</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at top, #32104d 0%, #120817 45%, #050507 100%);
    color: white;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
}

/* HEADER */

header {
    text-align: center;
    padding: 55px 20px 25px;
}

.logo {
    font-size: 78px;
    font-weight: 900;
    font-style: italic;
    letter-spacing: 5px;
    color: #c56cff;
    text-shadow:
        0 0 10px #b84cff,
        0 0 25px #9d3cff,
        0 0 50px #7b22c9;
}

.subtitle {
    margin-top: 15px;
    color: #f0c84b;
    font-size: 15px;
    letter-spacing: 7px;
}

.select-title {
    text-align: center;
    margin-top: 35px;
    margin-bottom: 35px;
    font-size: 16px;
    letter-spacing: 6px;
    color: #c9b9d8;
}

/* CARDS */

.characters {
    width: 92%;
    max-width: 1250px;
    margin: 0 auto 70px;

    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
}

.character {
    position: relative;
    height: 460px;

    overflow: hidden;
    cursor: pointer;

    background: #111;
    border: 1px solid rgba(255,255,255,0.08);

    transition:
        transform 0.3s ease,
        box-shadow 0.3s ease,
        border-color 0.3s ease;
}

.character:hover {
    transform: translateY(-8px);

    border-color: #c45cff;

    box-shadow:
        0 0 15px rgba(196,92,255,0.4),
        0 0 35px rgba(156,48,220,0.25);
}

/* FOTOĞRAFLAR */

.character img {
    width: 100%;
    height: 100%;

    object-fit: cover;
    object-position: center;

    display: block;

    transition: transform 0.5s ease;
}

.character:hover img {
    transform: scale(1.05);
}

/* FOTOĞRAFIN ALTINDAKİ KARARTI */

.character::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;

    height: 40%;

    background: linear-gradient(
        transparent,
        rgba(0,0,0,0.9)
    );

    pointer-events: none;
}

/* İSİM */

.name {
    position: absolute;
    z-index: 2;

    left: 0;
    right: 0;
    bottom: 18px;

    text-align: center;

    font-size: 23px;
    font-weight: 800;
    letter-spacing: 5px;

    color: white;

    text-shadow:
        0 2px 8px black,
        0 0 15px rgba(255,255,255,0.3);
}

/* VETO ALT LOGO */

.bottom-veto {
    text-align: center;
    margin-bottom: 40px;

    color: #c65cff;
    font-size: 35px;
    font-weight: 900;
    font-style: italic;
    letter-spacing: 5px;

    text-shadow: 0 0 20px #9b32d4;
}

/* MODAL */

.modal {
    position: fixed;
    inset: 0;

    background: rgba(0,0,0,0.82);

    display: none;
    align-items: center;
    justify-content: center;

    padding: 20px;

    z-index: 1000;
}

.modal.active {
    display: flex;
}

.modal-box {
    width: 100%;
    max-width: 650px;

    background:
        linear-gradient(
            145deg,
            #24102f,
            #0c0910
        );

    border: 1px solid #a942d1;

    box-shadow:
        0 0 30px rgba(177,58,232,0.35),
        0 0 80px rgba(122,26,167,0.2);

    padding: 35px;

    position: relative;

    animation: popup 0.25s ease;
}

@keyframes popup {

    from {
        opacity: 0;
        transform: scale(0.9);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }

}

.close {
    position: absolute;

    top: 15px;
    right: 20px;

    font-size: 28px;
    color: #aaa;

    cursor: pointer;
}

.close:hover {
    color: white;
}

.modal-name {
    color: #cf68ff;

    font-size: 38px;
    font-weight: 900;

    letter-spacing: 5px;

    margin-bottom: 8px;
}

.modal-role {
    color: #f0c84b;

    font-size: 14px;

    letter-spacing: 3px;

    margin-bottom: 28px;
}

.info {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 15px;
}

.info-item {
    background: rgba(255,255,255,0.05);

    border: 1px solid rgba(255,255,255,0.07);

    padding: 17px;
}

.info-label {
    color: #9f8aa9;

    font-size: 11px;

    letter-spacing: 2px;

    margin-bottom: 6px;
}

.info-value {
    color: white;

    font-size: 16px;

    font-weight: bold;
}

.bio {
    margin-top: 20px;

    padding: 18px;

    background: rgba(255,255,255,0.04);

    color: #ddd;

    line-height: 1.6;

    font-size: 14px;
}

/* MOBİL */

@media (max-width: 900px) {

    .characters {
        grid-template-columns: repeat(2, 1fr);
    }

    .character {
        height: 420px;
    }

}

@media (max-width: 600px) {

    .logo {
        font-size: 55px;
    }

    .subtitle {
        font-size: 11px;
        letter-spacing: 4px;
    }

    .select-title {
        font-size: 13px;
        letter-spacing: 4px;
    }

    .characters {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        width: 94%;
    }

    .character {
        height: 330px;
    }

    .name {
        font-size: 16px;
        letter-spacing: 3px;
    }

    .modal-box {
        padding: 25px;
    }

    .modal-name {
        font-size: 28px;
    }

    .info {
        grid-template-columns: 1fr;
    }

}

</style>
</head>


<body>

<header>

    <div class="logo">
        VETO
    </div>

    <div class="subtitle">
        WE DON'T FOLLOW. WE VETO.
    </div>

</header>


<div class="select-title">
    SELECT YOUR PLAYER
</div>


<section class="characters">

    <!-- DEAN -->

    <div class="character" onclick="selectPlayer(0)">

        <img src="leeknow.jpg" alt="DEAN">

        <div class="name">
            OVERKILL
        </div>

    </div>


    <!-- THEO -->

    <div class="character" onclick="selectPlayer(1)">

        <img src="hyunjin.jpg" alt="THEO">

        <div class="name">
            KYRO
        </div>

    </div>


    <!-- RIKU -->

    <div class="character" onclick="selectPlayer(2)">

        <img src="felix.jpg" alt="RIKU">

        <div class="name">
            AXEL
        </div>

    </div>


    <!-- ASH -->

    <div class="character" onclick="selectPlayer(3)">

        <img src="jungkook.jpg" alt="ASH">

        <div class="name">
            KAGE
        </div>

    </div>

</section>


<div class="bottom-veto">
    VETO
</div>


<!-- BİLGİ PENCERESİ -->

<div class="modal" id="playerModal">

    <div class="modal-box">

        <div class="close" onclick="closeModal()">
            ×
        </div>

        <div class="modal-name" id="playerName">
            DEAN
        </div>

        <div class="modal-role" id="playerRole">
            VETO GAMING
        </div>


        <div class="info">

            <div class="info-item">

                <div class="info-label">
                    YAŞ
                </div>

                <div class="info-value" id="playerAge">
                    26
                </div>

            </div>


            <div class="info-item">

                <div class="info-label">
                    RANK
                </div>

                <div class="info-value" id="playerRank">
                    IMMORTAL
                </div>

            </div>


            <div class="info-item">

                <div class="info-label">
                    ANA OYUN
                </div>

                <div class="info-value" id="playerGame">
                    Valorant
                </div>

            </div>


            <div class="info-item">

                <div class="info-label">
                    OYUN TARZI
                </div>

                <div class="info-value" id="playerStyle">
                    Aggressive
                </div>

            </div>

        </div>


        <div class="bio" id="playerBio">

            Skill is built in the lobby, proven in the match.
        

        </div>

    </div>

</div>


<script>

const players = [

    {
        name: "OVERKILL",
        role: "VETO GAMING",
        age: "26",
        rank: "IMMORTAL",
        game: "Valorant",
        style: "Aggressive",
        bio: "skill is built in the lobby, proven in the match."
    },

    {
        name: "KYRO",
        role: "VETO GAMING",
        age: "24",
        rank: "DIAMOND",
        game: "Valorant",
        style: "Entry Fragger",
        bio: "respawn stronger, strike harder. "
    },

    {
        name: "AXEL",
        role: "VETO GAMING",
        age: "22",
        rank: "PLATINUM",
        game: "Valorant",
        style: "Tactical",
        bio: "gamer by choice, legend by effort."
    },

    {
        name: "KAGE",
        role: "VETO GAMING",
        age: "29",
        rank: "ASCENDANT",
        game: "Valorant",
        style: "Defensive",
        bio: "i don't age, i level up."
    }

];


function selectPlayer(index) {

    const player = players[index];

    document.getElementById("playerName").innerText =
        player.name;

    document.getElementById("playerRole").innerText =
        player.role;

    document.getElementById("playerAge").innerText =
        player.age;

    document.getElementById("playerRank").innerText =
        player.position;

    document.getElementById("playerGame").innerText =
        player.game;

    document.getElementById("playerStyle").innerText =
        player.style;

    document.getElementById("playerBio").innerText =
        player.bio;

    document.getElementById("playerModal")
        .classList.add("active");

}


function closeModal() {

    document.getElementById("playerModal")
        .classList.remove("active");

}


document.getElementById("playerModal").addEventListener(
    "click",
    function(event) {

        if (event.target === this) {
            closeModal();
        }

    }
);


</script>

</body>
</html>
