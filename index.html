<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VETO — Gaming Team</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at top, #351044 0%, #120817 45%, #050507 100%);
    color: white;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
}

header {
    text-align: center;
    padding: 55px 20px 25px;
}

.logo {
    font-size: 78px;
    font-weight: 900;
    font-style: italic;
    letter-spacing: 6px;
    color: #c86cff;
    text-shadow:
        0 0 10px #b84cff,
        0 0 25px #9d3cff,
        0 0 50px #7b22c9;
}

.subtitle {
    margin-top: 15px;
    color: #f0c84b;
    font-size: 14px;
    letter-spacing: 6px;
}

.select-title {
    text-align: center;
    margin: 35px 0;
    font-size: 15px;
    letter-spacing: 5px;
    color: #d0c2d8;
}

.characters {
    width: 92%;
    max-width: 1200px;
    margin: auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
}

.character {
    height: 460px;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    background: #111;
    border: 1px solid rgba(255,255,255,.1);
    transition: .3s ease;
}

.character:hover {
    transform: translateY(-8px);
    border-color: #c45cff;
    box-shadow:
        0 0 18px rgba(196,92,255,.45),
        0 0 40px rgba(156,48,220,.25);
}

.character img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    object-position: center;
    transition: transform .5s ease;
}

.character:hover img {
    transform: scale(1.05);
}

.character::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 45%;
    background: linear-gradient(
        transparent,
        rgba(0,0,0,.95)
    );
    pointer-events: none;
}

.name {
    position: absolute;
    z-index: 2;
    left: 0;
    right: 0;
    bottom: 18px;
    text-align: center;
    font-size: 23px;
    font-weight: 900;
    letter-spacing: 5px;
    text-shadow: 0 2px 10px #000;
}

.bottom-veto {
    text-align: center;
    margin: 55px 0 40px;
    color: #c65cff;
    font-size: 34px;
    font-weight: 900;
    font-style: italic;
    letter-spacing: 6px;
    text-shadow: 0 0 20px #9b32d4;
}

/* PROFİL PENCERESİ */

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.82);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 1000;
}

.modal.active {
    display: flex;
}

.modal-box {
    width: 100%;
    max-width: 620px;
    background: linear-gradient(145deg,#281233,#0c0910);
    border: 1px solid #b64ce0;
    box-shadow:
        0 0 35px rgba(177,58,232,.4),
        0 0 80px rgba(122,26,167,.2);
    padding: 35px;
    position: relative;
    animation: popup .25s ease;
}

@keyframes popup {
    from {
        opacity: 0;
        transform: scale(.9);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

.close {
    position: absolute;
    top: 12px;
    right: 20px;
    font-size: 30px;
    color: #aaa;
    cursor: pointer;
}

.close:hover {
    color: white;
}

.modal-name {
    color: #d16aff;
    font-size: 40px;
    font-weight: 900;
    letter-spacing: 6px;
}

.modal-role {
    color: #f0c84b;
    margin-top: 8px;
    margin-bottom: 28px;
    font-size: 13px;
    letter-spacing: 3px;
}

.info {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}

.info-item {
    padding: 17px;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.08);
}

.info-label {
    color: #a996b0;
    font-size: 10px;
    letter-spacing: 2px;
    margin-bottom: 7px;
}

.info-value {
    color: white;
    font-size: 17px;
    font-weight: bold;
}

.bio {
    margin-top: 18px;
    padding: 18px;
    background: rgba(255,255,255,.04);
    color: #ddd;
    line-height: 1.6;
    font-size: 14px;
}

/* TELEFON */

@media (max-width: 900px) {
    .characters {
        grid-template-columns: repeat(2, 1fr);
    }

    .character {
        height: 420px;
    }
}

@media (max-width: 600px) {
    .logo {
        font-size: 55px;
    }

    .subtitle {
        font-size: 10px;
        letter-spacing: 3px;
    }

    .characters {
        width: 94%;
        gap: 10px;
    }

    .character {
        height: 330px;
    }

    .name {
        font-size: 16px;
        letter-spacing: 3px;
    }

    .info {
        grid-template-columns: 1fr;
    }

    .modal-box {
        padding: 25px;
    }

    .modal-name {
        font-size: 29px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">VETO</div>

    <div class="subtitle">
        WE DON'T FOLLOW. WE VETO.
    </div>
</header>

<div class="select-title">
    SELECT YOUR PLAYER
</div>

<section class="characters">

    <div class="character" onclick="selectPlayer(0)">
        <img src="leeknow.jpg" alt="OVERKILL">
        <div class="name">OVERKILL</div>
    </div>

    <div class="character" onclick="selectPlayer(1)">
        <img src="hyunjin.jpg" alt="KYRO">
        <div class="name">KYRO</div>
    </div>

    <div class="character" onclick="selectPlayer(2)">
        <img src="felix.jpg" alt="AXEL">
        <div class="name">AXEL</div>
    </div>

    <div class="character" onclick="selectPlayer(3)">
        <img src="jungkook.jpg" alt="KAGE">
        <div class="name">KAGE</div>
    </div>

</section>

<div class="bottom-veto">
    VETO
</div>

<!-- PROFİL -->

<div class="modal" id="playerModal">

    <div class="modal-box">

        <div class="close" onclick="closeModal()">×</div>

        <div class="modal-name" id="playerName"></div>

        <div class="modal-role">
            VETO GAMING
        </div>

        <div class="info">

            <div class="info-item">
                <div class="info-label">AGE</div>
                <div class="info-value" id="playerAge"></div>
            </div>

            <div class="info-item">
                <div class="info-label">RANK</div>
                <div class="info-value" id="playerRank"></div>
            </div>

        </div>

        <div class="bio" id="playerBio"></div>

    </div>

</div>

<script>

const players = [

    {
        name: "OVERKILL",
        age: "26",
        rank: "IMMORTAL",
        bio: "skill is built in the lobby, proven in the match."
    },

    {
        name: "KYRO",
        age: "24",
        rank: "DIAMOND",
        bio: "respawn stronger, strike harder."
    },

    {
        name: "AXEL",
        age: "22",
        rank: "PLATINUM",
        bio: "gamer by choice, legend by effort."
    },

    {
        name: "KAGE",
        age: "29",
        rank: "ASCENDANT",
        bio: "i don't age, i level up."
    }

];

function selectPlayer(index) {

    const player = players[index];

    document.getElementById("playerName").innerText =
        player.name;

    document.getElementById("playerAge").innerText =
        player.age;

    document.getElementById("playerRank").innerText =
        player.rank;

    document.getElementById("playerBio").innerText =
        player.bio;

    document.getElementById("playerModal")
        .classList.add("active");
}

function closeModal() {

    document.getElementById("playerModal")
        .classList.remove("active");
}

document.getElementById("playerModal").addEventListener(
    "click",
    function(event) {
        if (event.target === this) {
            closeModal();
        }
    }
);

</script>

</body>
</html>
